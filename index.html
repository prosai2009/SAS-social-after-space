    <meta name="theme-color" content="#050508" />
    <meta name="description" content="SAS // SOCIAL AFTER SPACE — YOUR PEOPLE. YOUR SPACE. YOUR UNIVERSE." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050508'/%3E%3Cpath d='M44 20H26l-6 6h16l-14 14h-8' stroke='%2300f0ff' stroke-width='5' fill='none'/%3E%3Cpath d='M20 44h18l6-6H28l14-14h8' stroke='%23b26bff' stroke-width='5' fill='none'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>SAS // SOCIAL AFTER SPACE</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // SAS black-box: any crash is painted on-screen instead of a silent black page.
      window.__sasCrash = function (label, err) {
        try {
          var msg = (err && (err.stack || err.message)) || String(err);
          var box = document.getElementById('sas-crash');
          if (!box) {
            box = document.createElement('pre');
            box.id = 'sas-crash';
            box.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;max-height:70vh;overflow:auto;'
              + 'z-index:99999;background:#180508;border:2px solid #ff3b5c;color:#ffd9df;'
              + 'font:12px/1.45 Consolas,monospace;padding:12px;white-space:pre-wrap;border-radius:6px;';
            (document.body || document.documentElement).appendChild(box);
          }
          box.textContent += '[' + label + ']\n' + msg + '\n\n';
        } catch (e) { /* never re-crash */ }
      };
      window.addEventListener('error', function (e) { window.__sasCrash('ERROR', e.error || e.message); });
      window.addEventListener('unhandledrejection', function (e) { window.__sasCrash('PROMISE', e.reason); });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
